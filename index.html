          <section id="home" aria-label="Introduction">
            <p style="font-size:0.85rem; color:#888;">10°03'09.4"N 76°15'25.2"E &bull; Kerala Backwaters, India</p>
            <h1>Kadamakudy — Not Tourist. Witness.</h1>
            <p><strong>Authentic <a href="#experience">Kerala Backwater Homestays</a> on the Islands of <a href="#about">Kadamakudy</a>, near Kochi, Kerala, India.</strong></p>
            <blockquote>
              Experience an authentic <a href="#experience">Kerala backwater homestay</a>. Learn from the local <a href="#stories">fishing village Kerala</a>. Discover the <a href="#about">Kadamakudy Islands</a> where life moves with the water.
            </blockquote>
            <img src="/images/hero.png" alt="Atmospheric view of Kadamakudy backwaters with traditional wooden structures and palm trees" style="max-width:100%; height:auto; margin: 15px 0; border-radius: 4px;" />
            <p>
              Kadamakudy is a cluster of ten interconnected backwater islands in Ernakulam District, Kerala, India —
              situated at 10.0526° N, 76.2570° E in the Vembanad Lake backwater network, approximately 15 km from Kochi (Cochin).
              These islands are home to traditional fishing families, Chinese fishing nets (cheena vala), mangrove forests,
              migratory birds, and generations of backwater culture.
            </p>
            <p>
              This is not a resort or a packaged tour. Kadamakudy connects respectful travelers with local fishing families
              for genuine homestay experiences. Money goes directly to the host families. Nothing is curated or performed.
            </p>
          </section>

          <!-- ── STORIES / EDITORIAL CHAPTERS ─────────────── -->
          <section id="stories" aria-label="Kerala backwater stories">
            <h2>Stories from the Backwaters</h2>

            <article id="the-river">
              <h3>01 — The River — Kochi Backwaters</h3>
              <p><em>"The river does not rush. It already knows where it belongs."</em></p>
              <img src="/images/houseboat-modern.png" alt="A modern wooden houseboat cruising on the calm Vembanad Lake backwaters near Kochi" style="max-width:100%; height:auto; margin: 15px 0; border-radius: 4px;" />
              <p>
                The Kadamakudy <a href="#home">Kochi backwaters</a> channels are not scenic drives — they are living highways that have carried
                fishing canoes, trading boats, and family memories for centuries. The water connects everything here.
                Without it, there are no islands, no livelihoods, no community.
              </p>
            </article>

            <article id="life-along-water">
              <h3>02 — Life Along the Water (Timeless Shores)</h3>
              <p>Simple lives in a traditional <a href="#stories">fishing village Kerala</a>. Timeless backwater rhythms. Stories passed down through <a href="#experience">authentic travel Kerala</a>.</p>
              <img src="/images/dwelling-simple.png" alt="A simple traditional fisherman's dwelling on the shore of Kadamakudy backwater islands" style="max-width:100%; height:auto; margin: 15px 0; border-radius: 4px;" />
              <p>
                Kadamakudy's fishing families have lived in the same homes for generations. Children learn to paddle
                canoes before they learn to ride bicycles. Fish are sorted by hand at dawn. Nets are mended by
                afternoon. This is not a museum of tradition — it is tradition, alive and continuous.
              </p>
            </article>

            <article id="floating-architecture">
              <h3>03 — Floating Architecture (Rustic Dwellings)</h3>
              <p>Homes that breathe with the <a href="#home">Kerala backwaters</a>. Built by tradition, held by nature. Traditional homes in a serene <a href="#contact">Kadamakudy islands</a> community.</p>
              <img src="/images/home-traditional.jpeg" alt="A traditional red-tiled roof Kerala home surrounded by lush coconut palms in Kadamakudy" style="max-width:100%; height:auto; margin: 15px 0; border-radius: 4px;" />
              <p>
                Traditional Kerala homes in Kadamakudy feature red-tiled sloped roofs, timber columns, open courtyards,
                and walls that have absorbed generations of cooking smoke, monsoon rain, and family conversation.
                They are not photogenic accidents — they are the result of centuries of building knowledge adapted
                to a landscape that floods and drains with the seasons.
              </p>
            </article>

            <article id="sky-and-water">
              <h3>04 — The Sky &amp; Water (Glimmering Coupling)</h3>
              <p>Where the sky meets the <a href="#gallery-moments">Kochi backwaters</a> reflection, offering a quiet space for <a href="#experience">conscious travel</a>.</p>
              <img src="/images/man.jpeg" alt="A local Kadamakudy fisherman preparing his net at sunset against the golden backwater sky" style="max-width:100%; height:auto; margin: 15px 0; border-radius: 4px;" />
              <p>
                At dawn and dusk, the Kadamakudy backwaters become mirrors. The sky and water trade colours.
                Fishermen in silhouette become part of the canvas. There are no crowds here, no ticket stalls,
                no photographer's marks on the ground. Just the water, the sky, and you, if you choose to be present.
              </p>
            </article>

            <article id="experience">
              <h3>05 — The Backwater Experience</h3>
              <p>An immersive journey of <a href="#about">responsible travel India</a>. It is a connection you carry long after you leave.</p>
              <p>
                Guests who have spent time in Kadamakudy describe it consistently: not as a destination they checked off,
                but as a relationship they entered. With a family. With a landscape. With a different understanding of
                what travel can mean when it is stripped of performance and returned to presence.
              </p>
            </article>

            <article id="gallery-moments">
              <h3>06 — Gallery of Moments</h3>
              <p>Fragments of a life woven with water, light and quiet memories.</p>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 15px 0;">
                <img src="/images/fishing-structures.png" alt="Traditional Chinese fishing nets (cheena vala) suspended over the Kadamakudy backwaters" style="width:100%; height:auto; border-radius: 4px;" />
                <img src="/images/houseboat-modern.png" alt="A scenic view of a modern houseboat sailing through a narrow canal in Kerala backwaters" style="width:100%; height:auto; border-radius: 4px;" />
                <img src="/images/dwelling-simple.png" alt="Stilt house along the water's edge in the rural islands of Kadamakudy" style="width:100%; height:auto; border-radius: 4px;" />
                <img src="/images/home-traditional.jpeg" alt="Close-up of traditional Kerala architecture showing wooden pillars and tiled roof" style="width:100%; height:auto; border-radius: 4px;" />
                <img src="/images/fishing-structures.png" alt="Rustic wooden fish trap structures and local canoes along the island shores" style="width:100%; height:auto; border-radius: 4px;" />
                <img src="/images/houseboat-modern.png" alt="Stunning reflection of a houseboat in the mirror-like waters of Kadamakudy at dusk" style="width:100%; height:auto; border-radius: 4px;" />
              </div>
              <p>
                Photography at Kadamakudy captures: Chinese fishing nets suspended over backwater channels at golden hour;
                wooden houseboats reflected in still water; fishermen sorting the morning catch; children paddling to school
                by canoe; coconut palms bending over mud embankments; migratory birds in flight over mangrove forests.
              </p>
            </article>
          </section>

          <!-- ── ABOUT ──────────────────────────────────────── -->
          <section id="about" aria-label="About Kadamakudy">
            <h2>Kadamakudy Isn't Pretty on Purpose</h2>
            <p><em>
              It's a working landscape. You'll see poverty alongside beauty. Struggle alongside grace.
              This isn't packaged for comfort.
            </em></p>
            <p>
              We refuse to hide what makes this place real. The fishermen we work with in this <a href="#stories">traditional fishing village Kerala</a> are not props in someone's narrative. They're neighbors. We stay in their homes because we respect their boundaries, their rhythms, and their right to say no.
            </p>
            <p>
              If you come here, you're committing to seeing — not just looking. To listening — not just hearing.
              To understanding that transformation isn't always comfortable.
            </p>

            <h3>What We Do</h3>
            <p>
              We connect respectful travelers with local families. We don't curate experiences — we facilitate
              genuine presence. Money goes directly to the families who host you.
            </p>

            <h3>What We Don't Do</h3>
            <p>
              We don't run sunset tours. We don't perform culture. We don't pretend poverty is picturesque.
              We don't accept tourists who see locals as scenery.
            </p>

            <h3>Requirements</h3>
            <p>
              Humility. Curiosity. Patience with discomfort. Respect for boundaries.
              A willingness to question what you know about travel and yourself.
            </p>
          </section>

          <section id="faq" aria-label="Frequently asked questions about Kadamakudy">
